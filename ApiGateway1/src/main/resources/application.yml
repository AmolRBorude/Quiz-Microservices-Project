
server:
  port: 8080

spring:
  application:
    name: ApiGateway1
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: quiz-service
              uri: lb://QUIZE-SERVICE
              predicates:
                - Path=/quiz/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
